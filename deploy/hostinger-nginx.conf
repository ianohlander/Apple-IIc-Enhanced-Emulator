# /etc/nginx/sites-available/apple2.ianohlander.com
# Apple //c Ultra - High Performance Nginx Server Configuration for Hostinger VPS

server {
    listen 80;
    listen [::]:80;
    server_name apple2.ianohlander.com;

    # Redirect all HTTP traffic to HTTPS (handled by certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apple2.ianohlander.com;

    # SSL Certificates (provisioned via 'certbot --nginx -d apple2.ianohlander.com')
    ssl_certificate /etc/letsencrypt/live/apple2.ianohlander.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apple2.ianohlander.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Web Root & Index
    root /var/www/apple2ultra;
    index index-standalone.html index.html;

    # Performance Caching for Static Assets (Images, Wasm, Audio, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|woff2?|svg|dsk|2mg|po)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Single Page Application Fallback
    location / {
        try_files $uri $uri/ /index-standalone.html;
    }
}
