[package]
name = "apple-iic-ultra"
version = "1.0.0"
description = "Apple //c Ultra Workstation Pro - Native 65C02 Systems Laboratory & Compiler Environment"
authors = ["Ian Ohlander <ian@ianohlander.com>"]
edition = "2021"
copyright = "Copyright (c) 2026 Ian Ohlander. All rights reserved."

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
